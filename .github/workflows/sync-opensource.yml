name: Sync to Open Source

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't persist the default GITHUB_TOKEN as a github.com credential header —
          # it overrides the PAT in the push URL below and makes the push run as
          # github-actions[bot] (403: no access to tylerbroqs/orlixai).
          persist-credentials: false

      - name: Push to tylerbroqs/orlixai
        run: |
          git remote add opensource https://x-access-token:${{ secrets.TYLERBROQS_PAT }}@github.com/tylerbroqs/orlixai.git
          git push opensource main --force
