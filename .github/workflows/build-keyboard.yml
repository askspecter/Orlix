name: Build Orlix Keyboard APK

on:
  push:
    branches: [ main ]
    paths:
      - 'keyboard/android/**'
      - '.github/workflows/build-keyboard.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keyboard/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orlix-keyboard-debug
          path: keyboard/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
