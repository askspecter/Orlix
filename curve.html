<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token — ORLIX Agent Launcher</title>
<meta name="description" content="Trade a launch on the bonding curve, watch its progress to graduation, and claim creator fees — on Robinhood Chain.">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="theme-color" content="#050505">
<link rel="stylesheet" href="/assets/cinematic/fonts/fonts.css">
<link rel="stylesheet" href="/assets/nft/app.css">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="/assets/nft/tokens.js"></script>
<script src="/assets/nft/wallet.js"></script>
<style>
  .cv-wrap{max-width:820px}
  .cv-grid{display:grid;gap:18px}
  @media(min-width:800px){.cv-grid{grid-template-columns:1.3fr 1fr;align-items:start}}
  .cv-card{border:1px solid var(--line-soft);border-radius:16px;background:var(--panel);overflow:hidden}
  .cv-pad{padding:20px}
  .cv-head{display:flex;align-items:center;gap:14px}
  .cv-logo{width:60px;height:60px;border-radius:14px;overflow:hidden;background:#12140d;flex:none;display:grid;place-items:center}
  .cv-logo img{width:100%;height:100%;object-fit:cover}
  .cv-ttl b{display:block;color:var(--ink);font-size:1.3rem;font-weight:600;letter-spacing:.01em}
  .cv-ttl span{display:block;font-size:.78rem;color:var(--ink-2)}
  .cv-ca{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-size:.68rem;color:var(--ink-3)}
  .cv-ca code{color:var(--green)}
  .cv-ca a{color:var(--ink-3)}
  .cv-price{font-size:2rem;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-top:4px}
  .cv-price small{font-size:.9rem;color:var(--ink-2);font-weight:400}
  .cv-sub{font-size:.74rem;color:var(--ink-3);margin-top:4px}
  .cv-barwrap{margin-top:18px}
  .cv-barrow{display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
  .cv-barrow b{color:var(--green);font-weight:600}
  .cv-bar{height:10px;border-radius:100px;background:#141710;overflow:hidden}
  .cv-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-deep),var(--green));border-radius:100px;width:0;transition:width .8s var(--ease)}
  .cv-raise{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-2);margin-top:10px}
  .cv-chart{margin-top:6px;background:#080a06;border-top:1px solid var(--line-soft)}
  .cv-chart svg{display:block;width:100%;height:190px}
  .cv-toggle{display:flex;gap:4px;border:1px solid var(--line-soft);border-radius:11px;padding:4px;margin-bottom:16px}
  .cv-toggle button{flex:1;font-family:var(--mono);font-size:.82rem;color:var(--ink-2);background:none;border:none;cursor:pointer;padding:10px;border-radius:8px;transition:.16s;font-weight:600}
  .cv-toggle button.on{background:var(--green);color:#0a0c07}
  .cv-toggle button.sell.on{background:#ff6b6b;color:#160707}
  .cv-in{width:100%;background:#0a0c07;border:1px solid var(--line-soft);border-radius:11px;color:var(--ink);font-family:var(--mono);font-size:1.05rem;padding:14px;outline:none}
  .cv-in:focus{border-color:var(--green)}
  .cv-lbl{display:flex;justify-content:space-between;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
  .cv-lbl a{color:var(--green);cursor:pointer}
  .cv-act{width:100%;margin-top:14px;font-size:.95rem;padding:15px;font-weight:600}
  .cv-msg{font-size:.76rem;color:var(--ink-2);margin-top:12px;line-height:1.5;word-break:break-word}
  .cv-msg a{color:var(--green);text-decoration:underline}
  .cv-stat{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border-top:1px solid var(--line-soft)}
  .cv-stat div{background:var(--panel);padding:14px 16px}
  .cv-stat u{display:block;text-decoration:none;font-size:.56rem;letter-spacing:.2em;color:var(--ink-3)}
  .cv-stat b{display:block;color:var(--ink);font-size:.92rem;font-weight:600;margin-top:5px}
  .cv-fees{border:1px solid rgba(207,246,5,.3);border-radius:16px;background:linear-gradient(180deg,rgba(207,246,5,.05),transparent);padding:20px;margin-top:18px}
  .cv-fees h3{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:12px}
  .cv-fees .amt{font-size:1.4rem;color:var(--ink);font-weight:600}
  .cv-load{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:.85rem}
  .cv-search{display:flex;gap:10px;margin-bottom:20px}
  .cv-search input{flex:1;background:#0a0c07;border:1px solid var(--line-soft);border-radius:11px;color:var(--ink);font-family:var(--mono);font-size:.85rem;padding:12px 14px;outline:none}
</style>
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/"><img src="/assets/nft/orlix-mark.png" alt="ORLIX" width="30" height="30"><b>ORLIX<sup>®</sup></b></a>
    <div class="top-nav">
      <a class="ghost hide-sm" href="/launcher">Launcher</a>
      <button class="btn" id="connectBtn">CONNECT</button>
      <span class="chip" id="walletChip" style="display:none"><span id="walletAddr"></span></span>
    </div>
  </div>
</header>

<main class="wrap cv-wrap">
  <section style="padding:34px 0 18px">
    <a href="/launcher" style="font-size:.72rem;color:var(--ink-3)">&larr; Back to Launcher</a>
    <div class="cv-search" style="margin-top:16px">
      <input id="caIn" placeholder="Paste a launch token address (0x…)">
      <button class="btn" id="loadBtn" type="button">Load</button>
    </div>
    <div id="cvBody"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s)};
  var CFG={
    chainIdHex:"0x1237", chainId:4663, rpc:"https://rpc.mainnet.chain.robinhood.com/",
    explorer:"https://robinhoodchain.blockscout.com",
    v2Factory:"0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e",
    feeEscrow:"0xd3AFEB2a57f70eF218Aa82451c51B2fb0416Ac9e",
    agentNft:"0x20567CfDeee57ED9C6E74e5598ab75b986F1C47c"
  };
  var ZERO="0x0000000000000000000000000000000000000000";
  var PAIR_SYM={ "0x5fc5360d0400a0fd4f2af552add042d716f1d168":"USDG","0xd0601ce157db5bdc3162bbac2a2c8af5320d9eec":"NVDA","0x322f0929c4625ed5bad873c95208d54e1c003b2d":"TSLA","0xaf3d76f1834a1d425780943c99ea8a608f8a93f9":"AAPL" };
  function symOf(addr){ if(!addr||addr===ZERO)return"ETH"; return PAIR_SYM[addr.toLowerCase()]||"quote"; }

  var FAC_ABI=["function getLaunchedToken(address token) view returns ((address token,address curve,address deployer,address creatorFeeRecipient,address pairToken,uint256 graduationThreshold,uint24 poolFee,int24 tickSpacing,uint16 creatorTaxBps,bool buybackEnabled,uint8 phase,uint256 sweptQuote,uint256 sweptTokens,uint256 sweptAt,bool exists))"];
  var CURVE_ABI=[
    "function buy(uint256 quoteIn,uint256 minTokensOut,address recipient) payable returns (uint256)",
    "function sell(uint256 tokensIn,uint256 minQuoteOut,address recipient) returns (uint256)",
    "function getReserves() view returns (uint256 quoteReserve,uint256 tokenReserve)",
    "function realQuoteReserve() view returns (uint256)",
    "function graduationThreshold() view returns (uint256)",
    "function readyToGraduate() view returns (bool)",
    "function graduated() view returns (bool)",
    "function feeBps() view returns (uint256)",
    "function isNativeQuote() view returns (bool)",
    "function pairToken() view returns (address)",
    "event CurveBuy(address indexed buyer,address indexed recipient,uint256 quoteIn,uint256 tokensOut,uint256 fee,uint256 tax)",
    "event CurveSell(address indexed seller,address indexed recipient,uint256 tokensIn,uint256 quoteOut,uint256 fee,uint256 tax)"
  ];
  var TOKEN_ABI=["function name() view returns (string)","function symbol() view returns (string)","function decimals() view returns (uint8)","function totalSupply() view returns (uint256)","function getTokenInfo() view returns (address tokenDeployer,string tokenLogo,string tokenDescription,(string twitter,string telegram,string discord,string website,string farcaster) tokenSocials)"];
  var ERC20_ABI=["function decimals() view returns (uint8)","function balanceOf(address) view returns (uint256)","function allowance(address,address) view returns (uint256)","function approve(address,uint256) returns (bool)"];
  var ESCROW_ABI=["function balanceOf(address) view returns (uint256)","function balanceOfToken(address,address) view returns (uint256)","function claim()","function claimToken(address)"];
  var ACCT_ABI=["function execute(address to,uint256 value,bytes data,uint8 operation) payable returns (bytes)","function token() view returns (uint256,address,uint256)"];
  var NFT_ABI=["function ownerOf(uint256) view returns (address)"];

  var ro=new ethers.JsonRpcProvider(CFG.rpc,{chainId:CFG.chainId,name:"robinhood"});
  var toastT;function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},2000)}
  function short(a){return a.slice(0,6)+"…"+a.slice(-4)}
  function fmt(n){n=Number(n);if(!isFinite(n))return"0";if(n===0)return"0";if(n<1e-6)return n.toExponential(2);if(n<1)return n.toPrecision(3);return n.toLocaleString("en",{maximumFractionDigits:n<1000?2:0})}

  var S={addr:null, token:null, curve:null, dec:18, sym:"", name:"", logo:"", pairSym:"ETH", pairAddr:ZERO, pairDec:18, native:true, feeRecipient:ZERO, side:"buy", state:null};

  // connect
  function setConnected(a){S.addr=a;$("#connectBtn").style.display="none";var c=$("#walletChip");c.style.display="inline-flex";$("#walletAddr").textContent=short(a);if(S.token)renderFees();}
  function connect(){if(window.ORLIX_WALLET){ORLIX_WALLET.connect(function(a){setConnected(a)});return;}if(!window.ethereum){toast("No wallet found");return;}window.ethereum.request({method:"eth_requestAccounts"}).then(function(a){if(a&&a[0])setConnected(a[0])})}
  $("#connectBtn").addEventListener("click",connect);

  async function signer(){
    var bp=new ethers.BrowserProvider(window.ethereum),net=await bp.getNetwork();
    if(Number(net.chainId)!==CFG.chainId){await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:CFG.chainIdHex}]});bp=new ethers.BrowserProvider(window.ethereum);}
    return await bp.getSigner();
  }

  async function load(ca){
    ca=(ca||"").trim();
    if(!/^0x[0-9a-fA-F]{40}$/.test(ca)){toast("Enter a valid token address");return;}
    $("#cvBody").innerHTML='<div class="cv-load">Loading launch…</div>';
    history.replaceState(null,"","/curve?ca="+ca);
    try{
      var fac=new ethers.Contract(CFG.v2Factory,FAC_ABI,ro);
      var lt=await fac.getLaunchedToken(ca);
      if(!lt.exists){$("#cvBody").innerHTML='<div class="cv-load">Not an ORLIX/Pons v2 launch, or not found.</div>';return;}
      S.token=ca; S.curve=lt.curve; S.feeRecipient=lt.creatorFeeRecipient; S.pairAddr=lt.pairToken;
      var tk=new ethers.Contract(ca,TOKEN_ABI,ro);
      var cv=new ethers.Contract(lt.curve,CURVE_ABI,ro);
      var res=await Promise.all([tk.symbol().catch(()=>"?"),tk.name().catch(()=>""),tk.decimals().catch(()=>18),tk.getTokenInfo().catch(()=>null),tk.totalSupply().catch(()=>0n),cv.isNativeQuote().catch(()=>true)]);
      S.sym=res[0];S.name=res[1];S.dec=Number(res[2]);S.logo=res[3]?res[3].tokenLogo:"";S.supply=res[4];S.native=res[5];
      S.pairSym=symOf(S.pairAddr);
      if(!S.native&&S.pairAddr!==ZERO){try{S.pairDec=Number(await new ethers.Contract(S.pairAddr,ERC20_ABI,ro).decimals());}catch(_){S.pairDec=18;}}else S.pairDec=18;
      await refresh();
      renderShell();
      buildChart(lt.curve);
    }catch(e){ $("#cvBody").innerHTML='<div class="cv-load">Failed to load: '+((e&&e.message)||"").slice(0,80)+'</div>'; }
  }

  async function refresh(){
    var cv=new ethers.Contract(S.curve,CURVE_ABI,ro);
    var r=await Promise.all([cv.getReserves(),cv.realQuoteReserve(),cv.graduationThreshold(),cv.readyToGraduate().catch(()=>false),cv.graduated().catch(()=>false)]);
    var qr=r[0][0],tr=r[0][1];
    S.state={quoteReserve:qr,tokenReserve:tr,realQuote:r[1],threshold:r[2],ready:r[3],graduated:r[4],
      price: tr>0n? (Number(qr)/(10**S.pairDec))/(Number(tr)/(10**S.dec)) : 0,
      progress: r[2]>0n? Number(r[1])/Number(r[2]) : 0 };
  }

  function renderShell(){
    var s=S.state, pct=Math.min(100,Math.round(s.progress*1000)/10);
    var raised=Number(s.realQuote)/(10**S.pairDec), target=Number(s.threshold)/(10**S.pairDec);
    var mcap=s.price*(Number(S.supply)/(10**S.dec));
    var logo=S.logo?('<img src="'+S.logo+'" alt="" onerror="this.style.display=\'none\'">'):'<span style="color:var(--green);font-weight:700">'+(S.sym[0]||"?")+'</span>';
    $("#cvBody").innerHTML=
      '<div class="cv-grid">'
      +'<div>'
        +'<div class="cv-card">'
          +'<div class="cv-pad">'
            +'<div class="cv-head"><div class="cv-logo">'+logo+'</div><div class="cv-ttl"><b>$'+S.sym+'</b><span>'+(S.name||"")+'</span>'
              +'<div class="cv-ca"><code>'+short(S.token)+'</code><a href="'+CFG.explorer+'/token/'+S.token+'" target="_blank" rel="noopener">↗</a></div></div></div>'
            +'<div class="cv-price">'+fmt(s.price)+' <small>'+S.pairSym+'</small></div>'
            +'<div class="cv-sub">≈ '+fmt(mcap)+' '+S.pairSym+' market cap · '+(s.graduated?'<span style="color:var(--green)">graduated</span>':(s.ready?'ready to graduate':'on the curve'))+'</div>'
            +'<div class="cv-barwrap"><div class="cv-barrow"><span>Bond progress</span><b>'+pct+'%</b></div><div class="cv-bar"><i id="cvBar"></i></div>'
              +'<div class="cv-raise"><span>'+fmt(raised)+' '+S.pairSym+' raised</span><span>target '+fmt(target)+' '+S.pairSym+'</span></div></div>'
          +'</div>'
          +'<div class="cv-chart" id="cvChart"><div class="cv-load" style="padding:40px">Loading chart…</div></div>'
          +'<div class="cv-stat"><div><u>PAIR</u><b>'+S.pairSym+'</b></div><div><u>SUPPLY</u><b>'+fmt(Number(S.supply)/(10**S.dec))+'</b></div></div>'
        +'</div>'
      +'</div>'
      +'<div>'
        +'<div class="cv-card cv-pad">'
          +'<div class="cv-toggle"><button id="tBuy" class="on">Buy</button><button id="tSell" class="sell">Sell</button></div>'
          +'<div class="cv-lbl"><span id="amtLbl">You pay ('+S.pairSym+')</span><a id="maxBtn">MAX</a></div>'
          +'<input class="cv-in" id="amtIn" placeholder="0.0" inputmode="decimal">'
          +'<button class="btn cv-act" id="tradeBtn">'+(S.addr?'BUY $'+S.sym:'CONNECT TO TRADE')+'</button>'
          +'<div class="cv-msg" id="tradeMsg">Slippage: min-received is 0 (accept-any). Trades on the bonding curve until it graduates.</div>'
        +'</div>'
        +'<div id="feesBox"></div>'
      +'</div>'
      +'</div>';
    setTimeout(function(){var b=$("#cvBar");if(b)b.style.width=pct+"%"},50);
    $("#tBuy").addEventListener("click",function(){S.side="buy";sideUI()});
    $("#tSell").addEventListener("click",function(){S.side="sell";sideUI()});
    $("#tradeBtn").addEventListener("click",trade);
    $("#maxBtn").addEventListener("click",setMax);
    renderFees();
  }
  function sideUI(){
    $("#tBuy").classList.toggle("on",S.side==="buy");$("#tSell").classList.toggle("on",S.side==="sell");
    $("#amtLbl").textContent=S.side==="buy"?("You pay ("+S.pairSym+")"):("You sell ($"+S.sym+")");
    $("#tradeBtn").textContent=S.addr?((S.side==="buy"?"BUY $":"SELL $")+S.sym):"CONNECT TO TRADE";
  }
  async function setMax(){
    if(!S.addr){connect();return;}
    try{
      if(S.side==="sell"){var bal=await new ethers.Contract(S.token,ERC20_ABI,ro).balanceOf(S.addr);$("#amtIn").value=ethers.formatUnits(bal,S.dec);}
      else if(S.native){var b=await ro.getBalance(S.addr);$("#amtIn").value=(Number(ethers.formatEther(b))*0.98).toFixed(4);}
      else{var b2=await new ethers.Contract(S.pairAddr,ERC20_ABI,ro).balanceOf(S.addr);$("#amtIn").value=ethers.formatUnits(b2,S.pairDec);}
    }catch(_){}
  }

  async function trade(){
    if(!S.addr){connect();return;}
    var amt=$("#amtIn").value.trim(); if(!amt||Number(amt)<=0){toast("Enter an amount");return;}
    var btn=$("#tradeBtn"),msg=$("#tradeMsg"); btn.disabled=true;
    try{
      var sg=await signer(); var cv=new ethers.Contract(S.curve,CURVE_ABI,sg);
      if(S.side==="buy"){
        var qin=ethers.parseUnits(amt,S.pairDec);
        if(S.native){ btn.textContent="SIGN…"; msg.textContent="Buying…"; var tx=await cv.buy(qin,0n,S.addr,{value:qin,gasLimit:2500000n}); await done(tx); }
        else{
          var erc=new ethers.Contract(S.pairAddr,ERC20_ABI,sg); var al=await erc.allowance(S.addr,S.curve);
          if(al<qin){ btn.textContent="APPROVE…"; msg.textContent="Approve "+S.pairSym+"…"; var a=await erc.approve(S.curve,qin,{gasLimit:120000n}); await a.wait(); }
          btn.textContent="SIGN…"; msg.textContent="Buying…"; var tx2=await cv.buy(qin,0n,S.addr,{gasLimit:2500000n}); await done(tx2);
        }
      }else{
        var tin=ethers.parseUnits(amt,S.dec);
        var tkc=new ethers.Contract(S.token,ERC20_ABI,sg); var al2=await tkc.allowance(S.addr,S.curve);
        if(al2<tin){ btn.textContent="APPROVE…"; msg.textContent="Approve $"+S.sym+"…"; var a2=await tkc.approve(S.curve,tin,{gasLimit:120000n}); await a2.wait(); }
        btn.textContent="SIGN…"; msg.textContent="Selling…"; var tx3=await cv.sell(tin,0n,S.addr,{gasLimit:2500000n}); await done(tx3);
      }
    }catch(e){ btn.disabled=false; sideUI(); msg.innerHTML='<span style="color:#ff6b6b">'+((e&&(e.shortMessage||e.message))||"Failed").slice(0,110)+'</span>'; }
  }
  async function done(tx){
    $("#tradeMsg").innerHTML='Confirming… <a href="'+CFG.explorer+'/tx/'+tx.hash+'" target="_blank" rel="noopener">'+short(tx.hash)+'</a>';
    await tx.wait(); toast("Done ✓"); $("#tradeMsg").textContent="Trade confirmed."; $("#amtIn").value="";
    await refresh(); var s=S.state,pct=Math.min(100,Math.round(s.progress*1000)/10); var b=$("#cvBar"); if(b)b.style.width=pct+"%";
    $("#tradeBtn").disabled=false; sideUI(); renderFees();
  }

  // ── creator fee claim ──
  async function renderFees(){
    var box=$("#feesBox"); if(!box)return;
    if(!S.addr){box.innerHTML="";return;}
    try{
      var esc=new ethers.Contract(CFG.feeEscrow,ESCROW_ABI,ro);
      var nativeBal=await esc.balanceOf(S.feeRecipient).catch(()=>0n);
      var tokenBal=0n; if(!S.native&&S.pairAddr!==ZERO){tokenBal=await esc.balanceOfToken(S.feeRecipient,S.pairAddr).catch(()=>0n);}
      // can the connected wallet claim for this recipient?
      var canClaim=false, viaAgent=false, agentId=null;
      if(S.feeRecipient.toLowerCase()===S.addr.toLowerCase()){canClaim=true;}
      else{
        try{ var acct=new ethers.Contract(S.feeRecipient,ACCT_ABI,ro); var t=await acct.token();
          if(t[1].toLowerCase()===CFG.agentNft.toLowerCase()){ var owner=await new ethers.Contract(CFG.agentNft,NFT_ABI,ro).ownerOf(t[2]);
            if(owner.toLowerCase()===S.addr.toLowerCase()){canClaim=true;viaAgent=true;agentId=Number(t[2]);} } }catch(_){}
      }
      var total=Number(ethers.formatEther(nativeBal))+ (tokenBal>0n?Number(ethers.formatUnits(tokenBal,S.pairDec)):0);
      if(nativeBal===0n && tokenBal===0n){
        box.innerHTML='<div class="cv-fees"><h3>Creator fees</h3><div class="cv-msg">No fees accrued yet'+(viaAgent?' for Agent #'+agentId:'')+'. Fees build as people trade.</div></div>';
        return;
      }
      var amtStr=(nativeBal>0n?fmt(Number(ethers.formatEther(nativeBal)))+" ETH":"")+(tokenBal>0n?(nativeBal>0n?" + ":"")+fmt(Number(ethers.formatUnits(tokenBal,S.pairDec)))+" "+S.pairSym:"");
      box.innerHTML='<div class="cv-fees"><h3>Creator fees'+(viaAgent?' · Agent #'+agentId:'')+'</h3><div class="amt">'+amtStr+'</div>'
        +'<div class="cv-msg">'+(canClaim?'Claim into '+(viaAgent?"the Agent's wallet":"your wallet")+'.':'Only the creator ('+short(S.feeRecipient)+') can claim.')+'</div>'
        +(canClaim?'<button class="btn cv-act" id="claimBtn">CLAIM FEES</button>':'')+'<div class="cv-msg" id="claimMsg"></div></div>';
      if(canClaim){ $("#claimBtn").addEventListener("click",function(){claim(viaAgent,nativeBal>0n,tokenBal>0n)}); }
    }catch(_){ box.innerHTML=""; }
  }
  async function claim(viaAgent,hasNative,hasToken){
    var btn=$("#claimBtn"),msg=$("#claimMsg"); btn.disabled=true; btn.textContent="SIGN…";
    try{
      var sg=await signer();
      var escI=new ethers.Interface(ESCROW_ABI);
      if(viaAgent){
        var acct=new ethers.Contract(S.feeRecipient,ACCT_ABI,sg);
        if(hasNative){ var d=escI.encodeFunctionData("claim"); var tx=await acct.execute(CFG.feeEscrow,0n,d,0,{gasLimit:400000n}); await tx.wait(); }
        if(hasToken){ var d2=escI.encodeFunctionData("claimToken",[S.pairAddr]); var tx2=await acct.execute(CFG.feeEscrow,0n,d2,0,{gasLimit:400000n}); await tx2.wait(); }
      }else{
        var esc=new ethers.Contract(CFG.feeEscrow,ESCROW_ABI,sg);
        if(hasNative){ var t=await esc.claim({gasLimit:250000n}); await t.wait(); }
        if(hasToken){ var t2=await esc.claimToken(S.pairAddr,{gasLimit:250000n}); await t2.wait(); }
      }
      toast("Fees claimed ✓"); renderFees();
    }catch(e){ btn.disabled=false; btn.textContent="CLAIM FEES"; msg.innerHTML='<span style="color:#ff6b6b">'+((e&&(e.shortMessage||e.message))||"Failed").slice(0,100)+'</span>'; }
  }

  // ── price chart (from curve trade events) ──
  async function buildChart(curve){
    var el=$("#cvChart"); if(!el)return;
    try{
      var iface=new ethers.Interface(CURVE_ABI);
      var latest=await ro.getBlockNumber();
      var lookback=120000n, chunk=12000n, start=latest>lookback?latest-lookback:0n;
      var pts=[];
      for(var to=latest; to>=start; to-=chunk){
        var from=(to-chunk+1n>start)?(to-chunk+1n):start;
        var logs=await ro.getLogs({address:curve,fromBlock:from,toBlock:to}).catch(()=>[]);
        for(var i=0;i<logs.length;i++){ try{ var pl=iface.parseLog(logs[i]); if(!pl)continue;
          var price=0;
          if(pl.name==="CurveBuy"){ var q=pl.args.quoteIn,t=pl.args.tokensOut; if(t>0n)price=(Number(q)/(10**S.pairDec))/(Number(t)/(10**S.dec)); }
          else if(pl.name==="CurveSell"){ var q2=pl.args.quoteOut,t2=pl.args.tokensIn; if(t2>0n)price=(Number(q2)/(10**S.pairDec))/(Number(t2)/(10**S.dec)); }
          if(price>0&&isFinite(price)) pts.push({b:Number(logs[i].blockNumber),p:price});
        }catch(_){}}
        if(pts.length>2 && (latest-from)>60000n) break;
        if(from===start)break;
      }
      pts.sort(function(a,b){return a.b-b.b});
      drawChart(el,pts);
    }catch(e){ el.innerHTML='<div class="cv-load" style="padding:40px">No trade history yet.</div>'; }
  }
  function drawChart(el,pts){
    if(!pts.length){ var pr=S.state?S.state.price:0; pts=[{b:0,p:pr},{b:1,p:pr}]; }
    var W=560,H=190,pad=10;
    var ps=pts.map(function(p){return p.p}), mn=Math.min.apply(null,ps), mx=Math.max.apply(null,ps);
    if(mx===mn){mx=mn*1.05||1;mn=mn*0.95;}
    var n=pts.length;
    var d=pts.map(function(p,i){ var x=pad+(n<2?0:(i/(n-1))*(W-2*pad)); var y=pad+(1-(p.p-mn)/(mx-mn))*(H-2*pad); return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }).join(" ");
    var area=d+" L"+(W-pad)+" "+(H-pad)+" L"+pad+" "+(H-pad)+" Z";
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
      +'<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFF605" stop-opacity=".22"/><stop offset="1" stop-color="#CFF605" stop-opacity="0"/></linearGradient></defs>'
      +'<path d="'+area+'" fill="url(#g)"/><path d="'+d+'" fill="none" stroke="#CFF605" stroke-width="2" stroke-linejoin="round"/></svg>';
  }

  // init
  $("#loadBtn").addEventListener("click",function(){load($("#caIn").value)});
  $("#caIn").addEventListener("keydown",function(e){if(e.key==="Enter")load($("#caIn").value)});
  var ca=new URLSearchParams(location.search).get("ca");
  if(ca){ $("#caIn").value=ca; load(ca); } else { $("#cvBody").innerHTML='<div class="cv-load">Paste a launch token address above to trade it, watch its bonding-curve progress, and claim creator fees.</div>'; }
})();
</script>
