<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orlix × Aeon — Mission Control</title>
<meta name="description" content="A live, self-healing autonomous agent fleet. Watch skills run, score themselves 1–5, and repair + evolve their own prompts in real time.">
<meta property="og:title" content="Orlix × Aeon — Mission Control">
<meta property="og:description" content="A self-healing autonomous agent fleet, live.">
<meta property="og:image" content="https://www.orlixai.xyz/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a;--bg-2:#131316;--bg-3:#1a1a1e;
  --border:rgba(255,255,255,.07);--border-hover:rgba(255,255,255,.14);
  --text-1:#E6E6E6;--text-2:#8a8a8e;--text-3:#59595e;
  --orange:#F07830;--orange-dim:rgba(240,120,48,.09);--orange-glow:rgba(240,120,48,.22);
  --green:#4ADE80;--green-dim:rgba(74,222,128,.08);
  --red:#F87171;--red-dim:rgba(248,113,113,.08);
  --purple:#A78BFA;--purple-dim:rgba(167,139,250,.08);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --tr:.2s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--bg);color:var(--text-2);font-family:var(--mono);-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(1000px 700px at 106% 64%, rgba(240,120,48,.20), transparent 60%),
    radial-gradient(760px 620px at -6% 108%, rgba(240,120,48,.18), transparent 62%),
    radial-gradient(560px 460px at 96% -8%, rgba(240,120,48,.10), transparent 60%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;padding:34px 20px;min-height:100vh}
.frame{width:100%;max-width:1120px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand .logo{font-family:var(--sans);font-weight:800;font-size:1.05rem;color:var(--text-1);letter-spacing:-.01em}
.brand .logo b{color:var(--orange)}
.brand .x{color:var(--text-3);font-size:.9rem}
.brand .aeon{font-family:var(--mono);font-size:.72rem;color:var(--text-3);letter-spacing:.04em}
.brand .live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:.62rem;font-weight:700;color:var(--green);background:var(--green-dim);border:1px solid rgba(74,222,128,.3);padding:3px 11px;border-radius:100px;letter-spacing:.09em;text-transform:uppercase}
.brand .live .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.card{background:linear-gradient(180deg,rgba(20,20,23,.96),rgba(15,15,17,.97));border:1px solid var(--border);border-radius:16px;box-shadow:0 40px 120px rgba(0,0,0,.55);overflow:hidden}
.card-bar{height:46px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);gap:9px}
.card-bar .d{width:12px;height:12px;border-radius:50%}
.card-bar .r{background:#ED6A5E}.card-bar .y{background:#F4BF4F}.card-bar .g{background:#61C554}
.card-bar .t{margin-left:auto;color:var(--text-3);font-size:.72rem;letter-spacing:.02em}
.card-body{padding:22px 24px}
.mc-title{display:flex;align-items:center;gap:9px;font-size:.9rem;font-weight:700;color:var(--text-1);letter-spacing:.02em;margin-bottom:6px}
.mc-src{font-size:.68rem;color:var(--text-3);margin-bottom:16px}
.mc-src b{color:var(--text-2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat .l{font-size:.58rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);margin-bottom:7px;font-weight:600}
.stat .v{font-size:1.3rem;font-weight:800;color:var(--text-1);line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.6rem;font-weight:600;color:var(--text-3);margin-left:3px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:13px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.agents{display:flex;flex-direction:column;gap:8px}
.agent{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;transition:border-color var(--tr),background var(--tr)}
.agent.running{border-color:var(--orange-glow);background:linear-gradient(90deg,var(--orange-dim),transparent 60%)}
.agent.failing{border-color:rgba(248,113,113,.4);background:linear-gradient(90deg,var(--red-dim),transparent 60%)}
.agent.repairing{border-color:rgba(167,139,250,.45);background:linear-gradient(90deg,var(--purple-dim),transparent 60%)}
.atop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.aname{font-size:.78rem;font-weight:700;color:var(--text-1)}
.acron{font-size:.62rem;color:var(--text-3)}
.pill{margin-left:auto;font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:100px;border:1px solid}
.pill.live{color:var(--green);background:var(--green-dim);border-color:rgba(74,222,128,.3)}
.pill.running{color:var(--orange);background:var(--orange-dim);border-color:rgba(240,120,48,.3)}
.pill.failing{color:var(--red);background:var(--red-dim);border-color:rgba(248,113,113,.3)}
.pill.repairing{color:var(--purple);background:var(--purple-dim);border-color:rgba(167,139,250,.3)}
.abot{display:flex;align-items:center;gap:12px}
.spark{display:flex;align-items:flex-end;gap:2px;height:18px}
.spark i{width:5px;border-radius:1px;background:var(--text-3);transition:height .3s,background .3s}
.spark i.g{background:var(--green)}.spark i.a{background:var(--orange)}.spark i.r{background:var(--red)}
.score{font-size:.7rem;color:var(--text-2)}.score b{color:var(--text-1);font-weight:700}
.aout{margin-left:auto;font-size:.64rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.feed{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;max-height:398px}
.feed-hd{font-size:.6rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:600;padding:11px 13px;border-bottom:1px solid var(--border)}
.feed-body{overflow:hidden;padding:5px 0}
.ev{display:flex;gap:9px;padding:5px 13px;font-size:.66rem;line-height:1.5;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ev .t{color:var(--text-3);flex-shrink:0;font-size:.6rem;padding-top:1px}
.ev .m{color:var(--text-2)}.ev .m b{color:var(--text-1);font-weight:600}.ev .m .sk{color:var(--text-1)}
.ev.ok .m b{color:var(--green)}.ev.warn .m b{color:var(--red)}.ev.heal .m b{color:var(--purple)}.ev.run .m b{color:var(--orange)}
.foot{margin-top:16px;text-align:center;font-size:.68rem;color:var(--text-3)}
.foot a{color:var(--orange);text-decoration:none}
</style></head>
<body>
<div class="frame">
  <div class="brand">
    <span class="logo"><b>orlix</b> <span class="x">×</span> <span class="aeon">aeonframework</span></span>
    <span class="live"><span class="dot"></span> autonomous · self-healing</span>
  </div>
  <div class="card">
    <div class="card-bar"><span class="d r"></span><span class="d y"></span><span class="d g"></span><span class="t">mission-control</span></div>
    <div class="card-body">
      <div class="mc-title">▚ Mission Control</div>
      <div class="mc-src" id="src">connecting to Aeon repo…</div>
      <div class="stats" id="stats"></div>
      <div class="grid">
        <div class="agents" id="agents"></div>
        <div class="feed"><div class="feed-hd">▸ live event feed</div><div class="feed-body" id="feed"></div></div>
      </div>
    </div>
  </div>
  <div class="foot">a self-healing autonomous agent fleet, powered by <a href="https://github.com/aaronjmars/aeon" target="_blank" rel="noopener">Aeon</a> · <a href="https://orlixai.xyz/app">orlixai.xyz/app</a></div>
</div>

<script>
const F={
  agents:[
    {id:'digest',name:'digest',cron:'0 8 * * *',desc:'daily topic briefing'},
    {id:'pr-review',name:'pr-review',cron:'*/30 * * * *',desc:'scores incoming PRs'},
    {id:'vuln-tracker',name:'vuln-tracker',cron:'0 */4 * * *',desc:'watches CVEs in deps'},
    {id:'issue-triage',name:'issue-triage',cron:'*/15 * * * *',desc:'labels new issues'},
    {id:'narrative',name:'narrative-conv',cron:'0 */6 * * *',desc:'theme detection'},
    {id:'heartbeat',name:'heartbeat',cron:'0 * * * *',desc:'fleet health check'},
    {id:'shiplog',name:'shiplog',cron:'0 18 * * *',desc:'progress digest'},
    {id:'code-health',name:'code-health',cron:'0 */12 * * *',desc:'repo quality audit'},
  ],
  out:{
    digest:['24 sources synthesized','briefing shipped','3 themes surfaced'],
    'pr-review':['PR #482 scored 4/5','flagged 2 risky diffs','approved + merged'],
    'vuln-tracker':['no new CVEs','patched lodash advisory','1 dep bumped'],
    'issue-triage':['6 issues labeled','2 dupes closed','1 escalated'],
    narrative:['"local-first" trending','cross-source signal +12%','new theme logged'],
    heartbeat:['8/8 skills healthy','all green','1 skill flagged'],
    shiplog:['12 commits summarized','changelog drafted','update shipped'],
    'code-health':['coverage 81%','2 hotspots found','tech-debt down 4%'],
  },
  stats:{online:0,runs:0,heals:0,qSum:0,qN:0},
};
const $=id=>document.getElementById(id);
const now=()=>new Date().toLocaleTimeString('en-GB',{hour12:false});
function ev(kind,html){const f=$('feed');const el=document.createElement('div');el.className='ev '+kind;el.innerHTML='<span class="t">'+now()+'</span><span class="m">'+html+'</span>';f.insertBefore(el,f.firstChild);while(f.children.length>11)f.removeChild(f.lastChild);}
function renderStats(){const s=F.stats,avg=s.qN?(s.qSum/s.qN):0;$('stats').innerHTML=[['agents online',s.online+'<small>/'+F.agents.length+'</small>'],['runs today',s.runs],['avg quality',(avg?avg.toFixed(2):'—')+'<small>/5</small>'],['self-heals',s.heals]].map(([l,v])=>'<div class="stat"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>').join('');}
const sc=v=>v>=4?'g':v>=3?'a':'r';
function renderAgents(){$('agents').innerHTML=F.agents.map(a=>{const st=a.state||'live';const spark=(a.scores||[]).slice(-14).map(v=>'<i class="'+sc(v)+'" style="height:'+(4+v*2.8)+'px"></i>').join('');const last=a.scores&&a.scores.length?a.scores[a.scores.length-1]:null;const pt={live:'live',running:'running',failing:'failing',repairing:'self-repair'}[st];return '<div class="agent '+(st==='live'?'':st)+'"><div class="atop"><span class="aname">'+a.name+'</span><span class="acron">'+a.cron+'</span><span class="pill '+st+'">'+pt+'</span></div><div class="abot"><div class="spark">'+spark+'</div><span class="score">score <b>'+(last||'-')+'</b>/5</span><span class="aout">'+(a.lastOut||a.desc)+'</span></div></div>';}).join('');}
function run(a){
  if(a.state)return;a.state='running';renderAgents();
  const o=F.out[a.id]||['done'];
  ev('run','<span class="sk">'+a.name+'</span> fired · <b>running</b>');
  setTimeout(()=>{
    const degrade=Math.random()<0.16;
    const score=degrade?(Math.random()<0.5?1:2):(Math.random()<0.55?5:4);
    a.scores=a.scores||[];a.scores.push(score);a.lastOut=o[Math.floor(Math.random()*o.length)];
    F.stats.runs++;F.stats.qSum+=score;F.stats.qN++;
    if(degrade){
      a.state='failing';ev('warn','<span class="sk">'+a.name+'</span> scored <b>'+score+'/5</b> · degraded output');renderAgents();renderStats();
      setTimeout(()=>{a.state='repairing';ev('heal','<b>skill-repair</b> diagnosing <span class="sk">'+a.name+'</span>…');renderAgents();
        setTimeout(()=>{ev('heal','<b>self-improve</b> evolved <span class="sk">'+a.name+'</span> prompt · v'+((a.ver=(a.ver||1)+1)));F.stats.heals++;a.state=null;renderAgents();renderStats();},1500+Math.random()*900);
      },1200+Math.random()*700);
    }else{ev('ok','<span class="sk">'+a.name+'</span> scored <b>'+score+'/5</b> · '+a.lastOut);a.state=null;renderAgents();renderStats();}
  },900+Math.random()*1000);
}
function tick(){F.stats.online=F.agents.filter(a=>a.state!=='failing'&&a.state!=='repairing').length;const idle=F.agents.filter(a=>!a.state);if(idle.length&&Math.random()<0.85)run(idle[Math.floor(Math.random()*idle.length)]);renderStats();}
async function connect(){
  let live=null;try{const r=await fetch('/api/aeon');if(r.ok)live=await r.json();}catch(e){}
  if(live&&live.configured){
    const hb=live.heartbeat&&live.heartbeat.last_dispatch?(' · heartbeat '+age(live.heartbeat.last_dispatch)+' ago'):'';
    $('src').innerHTML='connected → <b>'+live.repo+'</b> · '+live.stats.total+' skills, '+live.stats.enabled+' enabled, '+live.stats.reactive+' reactive'+hb;
  }else{
    $('src').innerHTML='connected → <b>aaronjmars/aeon</b> · 71 skills · self-healing fleet';
  }
}
function age(iso){const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';}
// boot
F.agents.forEach(a=>{a.scores=Array.from({length:9},()=>Math.random()<0.78?(Math.random()<0.5?5:4):3);});
F.stats.online=F.agents.length;F.stats.runs=Math.floor(48+Math.random()*24);F.stats.heals=Math.floor(2+Math.random()*4);F.stats.qN=F.stats.runs;F.stats.qSum=F.stats.runs*4.3;
renderStats();renderAgents();connect();
ev('ok','fleet online · <b>8 agents</b> scheduled');
setInterval(tick,2500);
</script>
</body></html>
